name: Secret scan

# PRD-216 US-007 (AC-4): gitleaks scans every PR and push for committed secrets,
# plus a weekly full-history sweep. A detected secret FAILS the run (blocking) —
# the throwaway CI stub values are allow-listed in .gitleaks.toml so they do not
# self-flag.
#
# NOTE (repo setting, not code): gitleaks-action requires a free GITLEAKS_LICENSE
# repo secret for GitHub ORGANIZATION-owned repos. If this repo is org-owned, add
# the free license (gitleaks.io) as the `GITLEAKS_LICENSE` secret; personal repos
# need nothing. Referenced by NAME below — never commit the value.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history sweep, Monday 05:17 UTC (off the top of the hour).
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the scheduled sweep scans every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to enumerate PR commits via
          # the API on pull_request events (breaking change). contents:read is
          # sufficient for same-repo PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
